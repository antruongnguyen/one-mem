name: CI

on:
  push:
    branches: [main]
    paths: &ci-paths
      - .gitattributes
      - .github/workflows/ci.yml
      - src/**
      - tests/**
      - scripts/**
      - package.json
      - bun.lock
      - tsconfig*.json
  pull_request:
    branches: [main]
    paths: *ci-paths

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
            platform: win32
            arch: x64
          - name: Linux glibc x64
            os: ubuntu-24.04
            platform: linux
            arch: x64
          - name: Linux glibc arm64
            os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - name: macOS arm64
            os: macos-15
            platform: darwin
            arch: arm64
          - name: Current runtimes on Linux x64
            os: ubuntu-24.04
            platform: linux
            arch: x64
            node: lts/*
            bun: latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node || '22.23.3' }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun || '1.4.4' }}

      - name: Verify native target
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          for runtime in node bun; do
            "$runtime" -e '
              const assert = require("node:assert/strict");
              assert.equal(process.platform, process.env.EXPECTED_PLATFORM);
              assert.equal(process.arch, process.env.EXPECTED_ARCH);
              console.log({ runtime: process.versions.bun ? "Bun" : "Node.js",
                version: process.versions.bun ?? process.versions.node,
                platform: process.platform, arch: process.arch });
              if (process.platform === "linux" && !process.versions.bun) {
                const glibc = process.report.getReport().header.glibcVersionRuntime;
                assert.ok(glibc, "Expected glibc on Linux");
                console.log({ glibc });
              }
            '
          done

      - run: bun install --frozen-lockfile
      - name: Check types and compile tests
        run: |
          bun run typecheck
          bun run test:build
      - name: Test runtimes and packaged consumers
        run: |
          bun run test:node
          bun run test:bun
          bun run test:package
      - name: Evaluate synthetic fixtures
        run: |
          bun run eval:node > evaluation-node.json
          bun run eval:bun > evaluation-bun.json
      - name: Retain evaluation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evaluation-${{ matrix.name }}
          path: evaluation-*.json
          if-no-files-found: ignore
